name: Notify Monorepo on Push

# Push trigger PAUSED for the Fox in the Box v0.6.0 upstream-separation
# migration (fox-in-the-box-ai/fox-in-the-box#155). The companion monorepo
# workflow `.github/workflows/sync-submodules.yml` is paused symmetrically
# for the same reason — auto-bumping the submodule pointer mid-migration
# would whipsaw the pin while phases 2-7 are in flight.
#
# Restored when v0.6.0 ships and the submodules re-point at virgin upstream
# (Phase 8). For manual dispatch during the migration, use workflow_dispatch.
on:
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger submodule sync in fox-in-the-box
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.MONOREPO_DISPATCH_TOKEN }}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/fox-in-the-box-ai/fox-in-the-box/dispatches \
            --data '{"event_type": "hermes-webui-updated"}'
